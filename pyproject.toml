[project]
name = "hea-calculator"
version = "1.0.0"         # keep in step with hea_calc.__version__
description = "Desktop calculator for high-entropy alloy thermodynamic descriptors and phase-prediction models"
readme = "README.md"
license = "GPL-3.0-or-later"
# PySide6 6.7.3 publishes wheels for Python 3.9-3.12 only; 3.11 is the tested configuration (.python-version)
requires-python = ">=3.11,<3.13"
dependencies = [
    "PySide6==6.7.3",
    "openpyxl>=3.1",      # spreadsheet import
    "XlsxWriter==3.2.0",  # spreadsheet export
]

[dependency-groups]
# installed by default with `uv sync`
dev = [
    "pytest>=8",
    "matplotlib>=3.9",    # only for tools/render_equations.py (generated equation SVGs are committed)
]
# app build (tools/build.py): `uv run --group build tools/build.py`
build = [
    "Nuitka==4.3.3",
    "patchelf==0.19.1.0 ; sys_platform == 'linux'",  # Nuitka needs it for Linux builds
]
# installed by default too; CI installs only this group
lint = [
    "ruff>=0.17.3",
]

[tool.uv]
default-groups = ["dev", "lint"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# pyflakes (F) and pycodestyle errors that are about correctness, not layout; spelled out so a ruff upgrade does not
# change what is checked.  Minus the ones the code style deliberately breaks:
select = ["E4", "E7", "E9", "F"]
ignore = [
    "E402",   # module import not at top: tests and tools put the repo on sys.path first
    "E702",   # several statements on one line with ';'
    "E731",   # assigning a lambda
    "E741",   # names like l / I / O
]
