name: Lint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      # only the lint group: ruff alone, not PySide6 and the rest; same rules and ruff version as locally
      - run: uv run --frozen --only-group lint ruff check --output-format=github .
