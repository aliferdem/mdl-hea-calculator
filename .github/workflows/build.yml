name: Build

# Test builds of the portable app (tools/build.py); the archives are listed under Artifacts on the run's page.
# Runs by hand (Actions → Build → Run workflow) and on pull requests that change the build.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/build.yml
      - tools/build.py
      - pyproject.toml
      - uv.lock

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # the oldest Ubuntu runner: the Linux build runs on systems with its glibc or newer
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      # the app's dependencies and Nuitka only, at the versions in uv.lock; the runners have MSVC and gcc
      - run: uv run --frozen --no-default-groups --group build tools/build.py
      # archive: false uploads the .zip / .tar.gz as is instead of zipping it again
      - uses: actions/upload-artifact@v7
        with:
          path: dist/*
          archive: false
